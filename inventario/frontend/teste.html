<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventário - Versão JavaScript Puro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 30px;
    }
    .container {
      max-width: 1100px;
    }
    h3 {
      color: #343a40;
    }
    .table th {
      background-color: #0d6efd;
      color: white;
    }
    .loading, .error, .empty {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
    }
    .loading { color: #0d6efd; }
    .error   { color: #dc3545; }
    .empty   { color: #6c757d; }
  </style>
</head>
<body>

<div class="container">

  <div class="text-center mb-4">
    <h3>Sistema de Inventário</h3>
  </div>

  <!-- Área onde a tabela ou mensagens vão aparecer -->
  <div id="conteudo">
    <div class="loading">Carregando produtos...</div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// Dados que vieram do seu console (copie e cole aqui se quiser testar fixo)
// ════════════════════════════════════════════════════════════════════════

// URL da sua API (deixe comentado se quiser usar os dados fixos acima)
const API_URL = 'http://localhost:8080/inventario/produtos';

// Função principal
async function carregarProdutos() {
  const conteudo = document.getElementById('conteudo');

  try {
    // Opção 1: usar a API real
    const resposta = await fetch(API_URL);
    
    // Opção 2: usar dados fixos (descomente se a API não estiver funcionando)
    // const resposta = { ok: true, json: async () => produtosFixosParaTeste };

    if (!resposta.ok) {
      throw new Error(`Erro HTTP: ${resposta.status}`);
    }

    const produtos = await resposta.json();

    // Verifica se veio array
    if (!Array.isArray(produtos) || produtos.length === 0) {
      conteudo.innerHTML = '<div class="empty">Nenhum produto encontrado.</div>';
      return;
    }

    // Monta a tabela
    let html = `
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Descrição do Produto</th>
            <th>Preço</th>
            <th>Estoque</th>
          </tr>
        </thead>
        <tbody>
    `;

    produtos.forEach((p, index) => {
      const precoFormatado = p.preco.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });

      html += `
        <tr>
          <td>${p.idproduto}</td>
          <td>${p.descricao}</td>
          <td>${precoFormatado}</td>
          <td>${p.estoque}</td>
        </tr>
      `;
    });

    html += `
        </tbody>
      </table>
    `;

    conteudo.innerHTML = html;

  } catch (erro) {
    console.error('Erro ao carregar:', erro);
    conteudo.innerHTML = `
      <div class="error">
        Não foi possível carregar os produtos.<br>
        <small>${erro.message}</small><br><br>
        <button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button>
      </div>
    `;
  }
}

// Inicia o carregamento ao abrir a página
carregarProdutos();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
